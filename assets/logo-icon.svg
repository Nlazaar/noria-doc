<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#a)" stroke-width="3"/>

  <!-- 6 spokes + buckets -->
  <g fill="url(#a)">
    <g transform="rotate(0,32,32)">
      <line x1="32" y1="24" x2="32" y2="9" stroke="url(#a)" stroke-width="2"/>
      <rect x="27.5" y="3" width="9" height="6.5" rx="2"/>
    </g>
    <g transform="rotate(60,32,32)">
      <line x1="32" y1="24" x2="32" y2="9" stroke="url(#a)" stroke-width="2"/>
      <rect x="27.5" y="3" width="9" height="6.5" rx="2"/>
    </g>
    <g transform="rotate(120,32,32)">
      <line x1="32" y1="24" x2="32" y2="9" stroke="url(#a)" stroke-width="2"/>
      <rect x="27.5" y="3" width="9" height="6.5" rx="2"/>
    </g>
    <g transform="rotate(180,32,32)">
      <line x1="32" y1="24" x2="32" y2="9" stroke="url(#a)" stroke-width="2"/>
      <rect x="27.5" y="3" width="9" height="6.5" rx="2"/>
    </g>
    <g transform="rotate(240,32,32)">
      <line x1="32" y1="24" x2="32" y2="9" stroke="url(#a)" stroke-width="2"/>
      <rect x="27.5" y="3" width="9" height="6.5" rx="2"/>
    </g>
    <g transform="rotate(300,32,32)">
      <line x1="32" y1="24" x2="32" y2="9" stroke="url(#a)" stroke-width="2"/>
      <rect x="27.5" y="3" width="9" height="6.5" rx="2"/>
    </g>
  </g>

  <!-- Hub -->
  <circle cx="32" cy="32" r="6" fill="url(#a)"/>
</svg>
