<svg width="188" height="64" viewBox="0 0 188 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#wheel)" stroke-width="2.5"/>

  <!-- 6 spokes + buckets -->
  <g fill="url(#wheel)">
    <g transform="rotate(0,32,32)">
      <line x1="32" y1="25" x2="32" y2="11" stroke="url(#wheel)" stroke-width="1.8"/>
      <rect x="28.5" y="5" width="7" height="5.5" rx="1.5"/>
    </g>
    <g transform="rotate(60,32,32)">
      <line x1="32" y1="25" x2="32" y2="11" stroke="url(#wheel)" stroke-width="1.8"/>
      <rect x="28.5" y="5" width="7" height="5.5" rx="1.5"/>
    </g>
    <g transform="rotate(120,32,32)">
      <line x1="32" y1="25" x2="32" y2="11" stroke="url(#wheel)" stroke-width="1.8"/>
      <rect x="28.5" y="5" width="7" height="5.5" rx="1.5"/>
    </g>
    <g transform="rotate(180,32,32)">
      <line x1="32" y1="25" x2="32" y2="11" stroke="url(#wheel)" stroke-width="1.8"/>
      <rect x="28.5" y="5" width="7" height="5.5" rx="1.5"/>
    </g>
    <g transform="rotate(240,32,32)">
      <line x1="32" y1="25" x2="32" y2="11" stroke="url(#wheel)" stroke-width="1.8"/>
      <rect x="28.5" y="5" width="7" height="5.5" rx="1.5"/>
    </g>
    <g transform="rotate(300,32,32)">
      <line x1="32" y1="25" x2="32" y2="11" stroke="url(#wheel)" stroke-width="1.8"/>
      <rect x="28.5" y="5" width="7" height="5.5" rx="1.5"/>
    </g>
  </g>

  <!-- Hub -->
  <circle cx="32" cy="32" r="5" fill="url(#wheel)"/>

  <!-- "noria" text -->
  <text x="68" y="43"
        font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
        font-size="28" font-weight="700"
        fill="url(#txt)"
        letter-spacing="-0.5">noria</text>
</svg>
